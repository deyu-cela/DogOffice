<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<title>左上 / 左下 HUD — 最終版</title>
<style>
  body { margin: 0; font-family: "Noto Sans TC", system-ui, sans-serif; background: #f4e8d8; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="hud-final.jsx"></script>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

function App() {
  return (
    <DesignCanvas title="左上 / 左下 HUD — 最終版（皮夾 + 便利貼）">
      <DCSection id="hud" title="最終組合">
        <DCArtboard id="final" label="左上：皮夾＋便利貼  /  左下：A 便利貼進度" width={1000} height={700}>
          <window.FinalHud/>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
